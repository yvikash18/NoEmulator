# NoEmulator artifact list.
#
# One directive per line. Blank lines and lines starting with # are ignored.
# An unrecognised directive is an error, never a silent skip.
#
#   hide <path>            make the path answer ENOENT for app processes
#   delprop <name>         delete the property outright, before zygote
#   setprop <name> <value> give the property a new value, before zygote
#   redirect <target> <replacement> <uid_scheme>
#                          make opens of <target> land on <replacement>, so the
#                          path an app reads back out of /proc/self/fd and
#                          /proc/self/maps is the replacement's. uid_scheme 0-4,
#                          per susfs4ksu-lkm-x64 PROC_INTERFACES.en.md:112-120;
#                          2 is 'every process not in the su domain'.
#                          Written with susfs's no_reverse flag where the
#                          susfs build has it, so the name is not rewritten back
#                          for apps with "Umount modules" on.
#   kstat_inode <path> <inode>
#                          apps that stat the path read <inode>; every other
#                          stat field stays live. susfs applies it only to apps
#                          with KernelSU's "Umount modules" on.
#   delprop_after_wifi <name>
#                          delete the property once wlan0 exists, for the one
#                          property the emulated Wi-Fi needs at startup
#   delprop_once_set <name>
#                          delete the property once a vendor service has set it;
#                          for properties that do not exist yet when delprop runs
#   angle <package>        run the package on ANGLE, so its glGetString answers
#                          carry no emulator token
#   setting <namespace> <key> <value>
#                          write a settings row after boot; uninstall puts the
#                          old value back unless it was changed since
#   native_bridge keep     keep the ARM native bridge, so ARM-only apps run;
#                          apps can then see it. Takes effect after a reboot
#   boot_qemu keep         keep ro.boot.qemu, so the host clipboard syncs; apps
#                          can then see it. Takes effect after a reboot
#
# Every entry below was observed on the target AVD; see
# analysis/baseline/emulator_artifacts.txt and emulator_props.txt. Entries are not
# added on the strength of a name alone — /proc/sys/fs/binfmt_misc/* looks like an
# artifact and is deliberately absent, because an app gets EACCES on it
# (docs/research/spike-loader-visibility.md).

# --- emulator device nodes: renamed, never hidden --------------------------
# Duck Detector greps every line of /proc/self/fd and /proc/self/maps for
# 'goldfish', 'ranchu' and 'qemu' and scores a hit on any match
# (snapshot_process_scan.cpp:88 and :269). Both are all-or-nothing: one surviving
# match keeps the finding.
#
# Hiding these three boot-loops the device. gfxstream opens all of them inside
# every app process, so ENOENT makes the EGL driver fail init and libEGL
# dereferences the NULL extension string it gets back. Measured twice, isolated to
# those rules alone; see docs/adr/0010-emulator-device-nodes-stay-visible.md.
#
# A redirect is not a hide. post-mount.sh makes each replacement with the
# target's own major and minor, so it is the same device under a name that carries
# no token: every open succeeds, gfxstream is unaffected, and the path the app
# reads back is the replacement's.
#
# The stage matters as much as the rule. v0.4.1 applied these from service.sh and
# the detector's exported report still named /dev/goldfish_pipe_dprctd: the rules
# landed 20 seconds after the overlay mounted, and the detector process was
# already running by then. A redirect only governs opens that come after it.
#
# uid_scheme 2 rather than 3. Scheme 3 covers only a process KernelSU has already
# flagged for unmounting, and the opens that happen before that flag lands keep the
# real path: measured, the same app process showed both names at once. Scheme 2 is
# every process outside the su domain, which has no such race.
redirect /dev/goldfish_address_space /dev/gpu_as0 2
redirect /dev/goldfish_pipe_dprctd /dev/gpu_bridge0 2
redirect /dev/goldfish_sync /dev/sync_fence0 2

# --- the gralloc mapper ----------------------------------------------------
# mapper.ranchu.so is mapped into every app process and is the last 'ranchu' left
# in /proc/self/maps. It cannot be renamed the way the Vulkan HAL was: libui.so
# builds 'mapper.%s.so' from a suffix it does not read from any ro.* property, so
# there is no property to repoint.
#
# The redirect sidesteps that question. libui still asks for mapper.ranchu.so; the
# kernel opens the copy instead, and the maps line reads the copy's name. Measured
# on the two Vulkan HAL copies, which are byte-identical and so risk nothing: the
# app opened vulkan.zuma.so and /proc/self/maps reported the redirect target.
#
# customize.sh installs the copy from this line, so the rule cannot name a file
# that was never staged.
redirect /vendor/lib64/hw/mapper.ranchu.so /vendor/lib64/hw/mapper.zuma.so 2

# --- the GL renderer strings -----------------------------------------------
# No package is named, on purpose. Read this before adding one.
#
#   angle <package>
#
# runs that package on ANGLE instead of the emulator's GL driver, so its
# glGetString answers carry no emulator token. It is per package because that is
# how Android's angle_gl_driver_selection_pkgs works, and because ANGLE is a
# translation layer: putting every app on it is a real behaviour change for a
# cosmetic string.
#
# Measured on the target AVD with the probe APK, three states of the same app:
#
#   stock           GL_RENDERER  Android Emulator OpenGL ES Translator (Google SwiftShader)
#   angle           GL_RENDERER  ANGLE (Mesa, Vulkan 1.3.0 (llvmpipe (LLVM 21.0.0 256 bits)), Mesa-25.2.4)
#   angle + setprop GL_RENDERER  whatever debug.angle.gl_renderer says
#
# Two things the middle line should make obvious. ANGLE on its own removes the
# emulator tokens and substitutes 'llvmpipe', Mesa's software rasterizer, which
# answers the same question for anyone who asks it differently. And
# GL_SHADING_LANGUAGE_VERSION keeps '(ANGLE 2.1 git hash: ...)' in every state --
# Android 16's ANGLE has override properties for vendor, renderer and version and
# none for that one, so a package on ANGLE is identifiable as being on ANGLE.
#
# If you do set the three properties, keep them coherent with the shading language
# version you cannot change, which reads 'OpenGL ES GLSL ES 3.10'. A GL_VERSION
# claiming OpenGL ES 3.2 contradicts it outright: real ES 3.2 reports GLSL ES 3.20.
#
#   angle com.example.app
#   setprop debug.angle.gl_vendor   ARM
#   setprop debug.angle.gl_renderer <a renderer string for the GPU you claim>
#   setprop debug.angle.gl_version  OpenGL ES 3.1 <a driver version for that GPU>
#
# No values ship for those three because no verified GL_RENDERER string for the
# Pixel 8's Tensor G3 was found -- published sources disagree on the GPU's own core
# count (Immortalis-G715 MC10 against Mali-G715 MP7) and none quotes the driver
# string. Inventing one would put a contradiction in front of exactly the detector
# this is meant to satisfy.
#
# This is the only directive whose effect lives outside the module. It writes an
# Android settings key, so a package named here is added to whatever selection the
# device already has, and taken back out when the module is uninstalled -- by a
# cleanup uninstall.sh stages, because the uninstall itself runs before the
# framework exists and cannot call `settings`. Packages you put on ANGLE yourself
# are left alone in both directions.

# --- the ART native bridge -------------------------------------------------
# Deleted rather than hidden. Removing the property before zygote stops the bridge
# loading at all, which keeps /proc/self/maps and dl_iterate_phdr consistent;
# hiding the library instead creates a divergence a detector looks for.
# Hidden by default. `native_bridge keep` in the user config drops both deletes,
# so ARM-only apps run and every app can see the bridge (ADR 0023).
delprop ro.dalvik.vm.native.bridge
delprop ro.enable.native.bridge.exec

# --- QEMU guest properties -------------------------------------------------
# Deleted, not blanked: the detector scores presence, and ro.boot.qemu already
# reads 0 while still counting as a hit.
# Deleting ro.boot.qemu also turns off host clipboard sync, because the framework
# creates its emulator clipboard monitor only when Build.IS_EMULATOR is true.
# `boot_qemu keep` in the user config drops this one delete (ADR 0024).
delprop ro.boot.qemu
delprop ro.boot.qemu.avd_name
delprop ro.boot.qemu.adb.pubkey
delprop ro.boot.qemu.camera_hq_edge_processing
delprop ro.boot.qemu.camera_protocol_ver
delprop ro.boot.qemu.cpuvulkan.version
delprop ro.boot.qemu.gltransport.drawFlushInterval
delprop ro.boot.qemu.gltransport.name
delprop ro.boot.qemu.hwcodec.avcdec
delprop ro.boot.qemu.hwcodec.hevcdec
delprop ro.boot.qemu.hwcodec.vpxdec
delprop ro.boot.qemu.settings.system.screen_off_timeout
delprop ro.boot.qemu.vsync

# ro.kernel.qemu is 1 on the AVD: a direct emulator guest property to Duck
# Detector. It went unnoticed because another module blanked it (issue #73).
delprop ro.kernel.qemu

# ro.boot.qemu.virtiowifi is deleted late, not here. The Wi-Fi HAL reads it when
# it starts at 8.5s; deleting it at post-fs-data left the AVD with no wlan0 and a
# network contradiction a detector scores. The property is readable until wlan0
# comes up, roughly 10s into boot.
# See docs/adr/0016-delete-the-wifi-property-late.md.
delprop_after_wifi ro.boot.qemu.virtiowifi

# --- the userdata layout --------------------------------------------------
# The AVD's /data is ext4, and init creates /data/local, tmp and traces as
# inodes 65537, 65538 and 65539. Duck Detector flags a /data/local/tmp inode above
# 10000 (ShellTmpMetadataProbe.kt). A real Pixel 6a on f2fs read 49599 on
# 2026-10-20, so copying a real value would not pass either; 1234 is below the
# threshold (#78).
kstat_inode /data/local/tmp 1234

# --- the qemu. namespace ---------------------------------------------------
delprop qemu.hw.mainkeys

# --- the vendor.qemu. namespace --------------------------------------------
# Set by the qemu-props service at 5.35s, after post-fs-data, so a plain delprop
# finds nothing. Deleted once set and read; see lib/delete_once_set.sh and
# docs/adr/0020-delete-vendor-qemu-properties-once-set.md.
delprop_once_set vendor.qemu.timezone
delprop_once_set vendor.qemu.vport.bluetooth
delprop_once_set vendor.qemu.vport.uwb
delprop_once_set vendor.qemu.sf.fake_camera
#
# Off, and not offered in the WebUI. The radio HAL reads this one every time it
# starts. Measured at v0.6.2: with it deleted, the HAL aborted seconds later and
# on every restart, a tombstone every ~5 s until the reboot (issue #68).
#
#   delprop_once_set vendor.qemu.vport.modem

# --- held back pending the boot-loop bisect --------------------------------
# A tester's device boot-looped on v0.1.0 and the trigger was never isolated. Two
# suspects remain: these two display properties, and the `resetprop -c --force`
# rebuild in post-fs-data. They are held back so one boot separates the two.
#
# Both are real detector input and both must come back once the cause is known:
# qemu.sf.lcd_density is read by Duck Detector's QEMU-guest-property check, and it
# is the only density source on this image (ro.sf.lcd_density is empty), which is
# what makes deleting it a plausible trigger.
#
#   delprop ro.boot.qemu.skin
#   delprop qemu.sf.lcd_density

# --- device identity -------------------------------------------------------
# Pixel 8 ("shiba"), Android 16 build CP1A.260505.005. The detector scores these
# four as emulator hits because they carry a 'goldfish', 'ranchu' or 'sdk_gphone'
# token, so a value is needed, not a deletion: an app reads Build.MODEL and an
# empty one is its own anomaly.
#
# The fingerprint, the model and the product name are verbatim from Google's own
# OTA metadata for that build (post-build= in META-INF/com/android/metadata of
# shiba-ota-cp1a.260505.005-a604326e.zip); see docs/research/pixel8-android16-identity.md.
setprop ro.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.product.model Pixel 8
setprop ro.product.name shiba

# TARGET_BOOTLOADER_BOARD_NAME in the published device tree.
setprop ro.product.board shiba

# ro.hardware and ro.boot.hardware read 'ranchu' today, which is the hit. 'zuma' is
# the Tensor G3 SoC name this device tree builds for (TARGET_SOC := zuma).
setprop ro.hardware zuma
setprop ro.boot.hardware zuma

# Reads 'unknown' on the AVD, where ro.boot.mode is unset. vdinfos files it
# under its emulator checks and read 'normal' while another module set it
# (issue #73).
setprop ro.bootmode normal

# --- the Vulkan HAL --------------------------------------------------------
# An app's own /proc/self/maps carries /vendor/lib64/hw/vulkan.ranchu.so, which
# the detector scores as a direct virtualization signal. The mapping is not
# hidden: add_sus_map would make maps disagree with dl_iterate_phdr, and the same
# detector has a separate check for exactly that divergence
# (docs/research/spike-loader-visibility.md). The library is renamed instead, so
# every view of it agrees and none of them says 'ranchu'.
#
# libhardware opens <dir>/<id>.<variant>.so, trying the variant keys
# ro.hardware.<id>, ro.hardware, ro.product.board, ro.board.platform, ro.arch in
# that order, under /vendor/lib64/hw then /system/lib64/hw (strings in the
# image's own libhardware.so). ro.hardware is already 'zuma' and ro.product.board
# already 'shiba', so every fallback below this line is already a non-emulator
# name; ro.board.platform is empty and contributes nothing.
#
# ro.hardware.vulkan has two readers: libvulkan.so, which opens vulkan.<value>.so,
# and the ranchu composer, which switches to guest composition only when the value
# is 'pastel' (docs/research/egl-vulkan-property.md, finding 2). 'mali' is what a
# shipping Pixel 8 reports (device/google/zuma/device.mk) and keeps the composer
# as it is. customize.sh reads the variant back out of these two lines and copies
# the stock HAL to that name, which is why the value is written here and not in
# the installer.
setprop ro.hardware.vulkan mali
setprop ro.boot.hardware.vulkan mali

# --- the EGL driver --------------------------------------------------------
# ro.hardware.egl reads 'emulation', and libEGL.so opens libEGL_<value>.so,
# libGLESv1_CM_<value>.so and libGLESv2_<value>.so from /vendor/lib64/egl. All three
# names are in every GL app's /proc/self/maps. customize.sh copies the stock three
# to the 'mali' names from this line, as it does the Vulkan HAL; a value with no
# matching files aborts every GL process (docs/research/egl-vulkan-property.md,
# finding 3). Not 'angle': GraphicsEnvironment would then put every app on ANGLE.
setprop ro.hardware.egl mali

# --- the gralloc variant ---------------------------------------------------
# ro.hardware.gralloc reads 'ranchu', and every app can read it. Deleted, not
# renamed. Each of its six readers branches on the value 'minigbm' alone and
# treats anything else, empty included, as the goldfish path it takes today:
#   - gfxstream::createPlatformGralloc in libOpenglSystemCommon.so tests a
#     length of 7 plus the immediates 0x696e696d/0x6d626769 ("minigbm");
#   - libhardware.so builds "ro.hardware.%s" and already falls back to
#     gralloc.default.so, the only gralloc on the image.
# A real Pixel 8 does not set the property (docs/research/gralloc-property.md).
delprop ro.hardware.gralloc

# A token with no consumer. ro.hardware.power reads 'ranchu' and nothing on the
# image reads the property -- no match in /system/lib64, /vendor/lib64,
# /vendor/bin, /system/bin, /apex or /system/framework -- and no power.*.so HAL
# exists to load. Given a value rather than deleted, for the same reason as the
# identity block above: a detector scores an absent property too.
setprop ro.hardware.power zuma

# --- the rest of the device identity ---------------------------------------
# Everything above this line was written against the properties that carry a
# 'goldfish', 'ranchu' or 'sdk_gphone' token. That was the wrong boundary. The
# AVD's remaining identity values carry no such token and are still wrong:
# ro.product.device reads 'emu64xa' and ro.build.id reads 'BE2A.250530.026.D1',
# while the fingerprint four lines up claims google/shiba/shiba:16/CP1A.260505.005.
# A detector that compares Build.FINGERPRINT against Build.DEVICE and Build.ID
# does not need to grep for an emulator name at all. See issue #27 and
# docs/adr/0018-mirror-a-real-pixel-8-partition-for-partition.md.
#
# Two sources, and the split between them matters. Every build-specific value --
# the id, the incremental, the fingerprint -- comes from Google's OTA metadata
# for CP1A.260505.005, which is Android 16 and matches this AVD's SDK 36
# (docs/research/pixel8-android16-identity.md). Every device-constant value --
# the SoC, the partition layout, the device codename -- comes from a real Pixel 8
# build.prop set (docs/research/pixel8-partition-identity.md). That dump is
# Android 17, so nothing version-bearing is taken from it.

# The device codename behind google/shiba/shiba. ro.build.product is init's
# deprecated alias for ro.product.device and has to move with it.
setprop ro.product.device shiba
setprop ro.build.product shiba

# The build CP1A.260505.005 identifies itself as. ro.build.display.id is what
# Settings shows and what the WebView and HTTP user agents put after 'Build/'.
setprop ro.build.id CP1A.260505.005
setprop ro.build.display.id CP1A.260505.005
setprop ro.build.version.incremental 15081906

# Both are mechanical restatements of the fingerprint: a real device builds them
# as '<name>-<type> <release> <id> <incremental> <tags>' and '<name>-<type>'.
setprop ro.build.description shiba-user 16 CP1A.260505.005 15081906 release-keys
setprop ro.build.flavor shiba-user

# The Pixel 8's SoC. Verbatim from the real build.prop's PRODUCT_VENDOR_PROPERTIES
# block; this was the value ADR 0009 could not source and left as 'ranchu'.
# ro.soc.manufacturer reads 'AOSP' on the AVD and 'Google' on the real device.
setprop ro.soc.model Tensor G3
setprop ro.soc.manufacturer Google

# The Pixel 8 launched on Android 14. The AVD claims it launched on the release
# it is running, which no shipped device does. The real build.prop reads 34.
#
# This is the one value here the framework acts on rather than merely reports --
# it gates vendor-interface and permission-grandfathering behaviour -- so it is
# the first thing to drop if a boot regresses.
setprop ro.product.first_api_level 34

# --- per-partition identity ------------------------------------------------
# Android keeps a copy of the identity in each partition's build.prop. The AVD's
# copies all read sdk_gphone64_x86_64 / emu64xa, which is what vdinfos scores as
# eight BUILD specs and five FINGERPRINT specs
# (analysis/baseline/vdinfos-20261018-1006.json).
#
# The 'system' partition is deliberately not given the device's values. A real
# Pixel 8 reports 'Generic System' / 'generic_system_google' / 'generic' there,
# because the system image is the generic one. Copying 'Pixel 8' into it would
# make this device disagree with every real Pixel, which is the opposite of the
# point. The AVD's 'mainline' is wrong in the same direction and is corrected to
# the real value rather than to the device's.
#
# This is why vdinfos' prop:variants:ro.product.*.model MISMATCH survives the
# slice. Its verdict is SPLIT system{system, system_ext, system_dlkm}, and a real
# Pixel 8 splits exactly there too: Generic System against Pixel 8 twice. The
# verdict is a property of Android's partition layout, not of a hider.
setprop ro.product.system.model Generic System
setprop ro.product.system.name generic_system_google

setprop ro.product.odm.model Pixel 8
setprop ro.product.odm.name shiba
setprop ro.product.odm.device shiba
setprop ro.product.product.model Pixel 8
setprop ro.product.product.name shiba
setprop ro.product.product.device shiba
setprop ro.product.system_dlkm.model Pixel 8
setprop ro.product.system_dlkm.name shiba
setprop ro.product.system_dlkm.device shiba
setprop ro.product.system_ext.model Pixel 8
setprop ro.product.system_ext.name shiba
setprop ro.product.system_ext.device shiba
setprop ro.product.vendor.model Pixel 8
setprop ro.product.vendor.name shiba
setprop ro.product.vendor.device shiba
setprop ro.product.vendor_dlkm.model Pixel 8
setprop ro.product.vendor_dlkm.name shiba
setprop ro.product.vendor_dlkm.device shiba

# The system partition's own fingerprint names the generic image, not the device.
# Verbatim shape from the real build.prop.
setprop ro.system.build.fingerprint google/generic_system_google/generic:16/CP1A.260505.005/15081906:user/release-keys

setprop ro.odm.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.product.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.system_dlkm.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.system_ext.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.vendor.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys
setprop ro.vendor_dlkm.build.fingerprint google/shiba/shiba:16/CP1A.260505.005/15081906:user/release-keys

# The build id and incremental are the same across every partition on a real
# device, including the generic system one.
# Apps cannot read ro.odm.build.id, on this AVD or on a real device: platform
# policy maps every ro.odm.* name to vendor_default_prop except date, date.utc,
# fingerprint, incremental and media_performance_class (AOSP system/sepolicy
# private/property_contexts:270 and :1203-1207). The row is for root-side readers
# such as getprop, so an app reading <unset> here is not a missed rule (#75).
setprop ro.odm.build.id CP1A.260505.005
setprop ro.product.build.id CP1A.260505.005
setprop ro.system.build.id CP1A.260505.005
setprop ro.system_dlkm.build.id CP1A.260505.005
setprop ro.system_ext.build.id CP1A.260505.005
setprop ro.vendor.build.id CP1A.260505.005
setprop ro.vendor_dlkm.build.id CP1A.260505.005

setprop ro.odm.build.version.incremental 15081906
setprop ro.product.build.version.incremental 15081906
setprop ro.system.build.version.incremental 15081906
setprop ro.system_dlkm.build.version.incremental 15081906
setprop ro.system_ext.build.version.incremental 15081906
setprop ro.vendor.build.version.incremental 15081906
setprop ro.vendor_dlkm.build.version.incremental 15081906

# Not set, deliberately. The real Pixel 8 build.prop also carries
# ro.product.*_for_attestation, ro.product.bootimage.*, ro.product.odm_dlkm.* and
# ro.build.device_family. None of those properties exists on this AVD, and adding
# a property the image does not have is an anomaly of its own -- the same reason
# ro.board.platform was left empty (docs/research/pixel8-android16-identity.md).
#
# The build dates are also left alone. ro.build.date reads Jul 2025, which
# predates CP1A.260505.005, and that is a real contradiction -- but no verified
# date for that build exists in any source held, and inventing one is worse than
# leaving it. Open question in docs/research/pixel8-partition-identity.md.

# Settings.Global device_name was copied from Build.MODEL once, at the AVD's first
# boot, before this module existed, and nothing in the framework rewrites it. It
# read sdk_gphone64_x86_64 while ro.product.model, bluetooth_name and the
# Bluetooth adapter name all read Pixel 8, and vdinfos scored it twice
# (set:device_name, spoof:device_name). No resetprop reaches a settings row, so
# the row itself is written after boot, and uninstall puts the old value back
# (docs/research/settings-device-name.md, issue #28). The value must stay equal
# to ro.product.model above; the suite checks it. The row's stored default keeps
# the emulator name: shell and root cannot replace a default the system set
# (finding 5 of that doc).
setting global device_name Pixel 8
